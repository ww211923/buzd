<script>
async function testConnection() {
    try {
        const response = await fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'test_connection',
                panel_url: document.getElementById('panelUrl').value,
                api_key: document.getElementById('apiKey').value
            })
        });
        const result = await response.json();
        document.getElementById('result').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
    } catch (error) {
        document.getElementById('result').innerHTML = `<span class="error">错误: ${error.message}</span>`;
    }
}

async function testAICommand() {
    try {
        const response = await fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'execute_ai_command',
                panel_url: document.getElementById('panelUrl').value,
                api_key: document.getElementById('apiKey').value,
                command: document.getElementById('testCommand').value
            })
        });

    }
}

}
